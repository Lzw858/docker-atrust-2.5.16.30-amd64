name: Build And Push Docker Image

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: ./.github/actions/build-and-push-docker-image
      with:
        registry_username: ${{secrets.DOCKERHUB_USERNAME}}
        registry_password: ${{secrets.DOCKERHUB_TOKEN}}
        # 镜像名跟随同一账号，避免默认推送到上游 hagb/... 因无权限而失败
        ec_image_name: ${{secrets.DOCKERHUB_USERNAME}}/docker-easyconnect
        atrust_image_name: ${{secrets.DOCKERHUB_USERNAME}}/docker-atrust
        # 只构建 amd64，缩短 CI 时长与磁盘占用
        archs: amd64

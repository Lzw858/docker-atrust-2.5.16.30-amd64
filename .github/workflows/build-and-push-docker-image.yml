name: Build And Push Docker Image

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v2
    - uses: ./.github/actions/build-and-push-docker-image
      with:
        # 推送到 GHCR，登录用运行自带的 GITHUB_TOKEN，无需配置任何 Secret
        registry: ghcr.io
        registry_username: ${{github.actor}}
        registry_password: ${{secrets.GITHUB_TOKEN}}
        # GHCR 的镜像名必须全小写
        ec_image_name: ghcr.io/lzw858/docker-easyconnect
        atrust_image_name: ghcr.io/lzw858/docker-atrust
        # 只构建 amd64，缩短 CI 时长与磁盘占用
        archs: amd64
